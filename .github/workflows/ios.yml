name: iOS build (FCode)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "test/origin-vectors.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "test/origin-vectors.json"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

concurrency:
  # Per branch: a feature-branch build never cancels a main build.
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The app has no test target: build Links.swift + PairLink.swift + HomeLogic.swift + ResponseCache.swift + LaunchFetch.swift for macOS with a tiny main, run their selfTests and the shared origin vectors.
      - name: Links + PairLink + HomeLogic + ResponseCache + LaunchFetch self-test
        run: |
          T=$(mktemp -d)
          cp ios/fcoding/Links.swift ios/fcoding/PairLink.swift ios/fcoding/HomeLogic.swift ios/fcoding/ResponseCache.swift ios/fcoding/LaunchFetch.swift "$T/"
          cat > "$T/main.swift" <<'EOF'
          import Foundation
          var failures = Links.selfTest() + PairLink.selfTest().map { "PairLink " + $0 }
            + HomeLogic.selfTest().map { "HomeLogic " + $0 }
            + ResponseCache.selfTest().map { "ResponseCache " + $0 }
          failures += await LaunchFetch.selfTest().map { "LaunchFetch " + $0 }
          // The shared origin table (same file as the server tests), path as the first argument.
          if CommandLine.arguments.count > 1, let data = FileManager.default.contents(atPath: CommandLine.arguments[1]) {
              failures += PairLink.checkVectors(data).map { "vector " + $0 }
          } else {
              failures.append("origin vectors file missing")
          }
          for f in failures { print("FAIL \(f)") }
          print(failures.isEmpty ? "Self-test: all passed" : "Self-test: \(failures.count) failed")
          exit(failures.isEmpty ? 0 : 1)
          EOF
          cd "$T"
          xcrun -sdk macosx swiftc -o linktest Links.swift PairLink.swift HomeLogic.swift ResponseCache.swift LaunchFetch.swift main.swift
          ./linktest "$GITHUB_WORKSPACE/test/origin-vectors.json"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project fcoding.xcodeproj -scheme fcoding \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/fcoding.app
          test -d "$APP"
          rm -rf Payload fcode.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry fcode.ipa Payload
          ls -l fcode.ipa

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fcode-ipa
          path: ios/fcode.ipa
          if-no-files-found: error

      - name: Publish pre-release "latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FCode (bản mới nhất)
          body: "Bản dựng mới nhất của FCode cho iPhone. Tải fcode.ipa rồi cài bằng Sideloadly."
          prerelease: true
          make_latest: false
          files: ios/fcode.ipa
          overwrite_files: true

      - name: Remove old fcoding.ipa asset
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest fcoding.ipa -y || true
