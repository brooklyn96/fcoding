name: iOS build (fcoding)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project fcoding.xcodeproj -scheme fcoding \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/fcoding.app
          test -d "$APP"
          rm -rf Payload fcoding.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry fcoding.ipa Payload
          ls -l fcoding.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcoding-ipa
          path: ios/fcoding.ipa
          if-no-files-found: error

      - name: Publish pre-release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: fcoding (bản mới nhất)
          body: "Bản dựng mới nhất của fcoding cho iPhone. Tải fcoding.ipa rồi cài bằng LiveContainer."
          prerelease: true
          make_latest: false
          files: ios/fcoding.ipa
          overwrite_files: true
