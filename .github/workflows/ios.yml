name: iOS build (FCode)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project fcoding.xcodeproj -scheme fcoding \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/fcoding.app
          test -d "$APP"
          rm -rf Payload fcode.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry fcode.ipa Payload
          ls -l fcode.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcode-ipa
          path: ios/fcode.ipa
          if-no-files-found: error

      - name: Publish pre-release "latest"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FCode (bản mới nhất)
          body: "Bản dựng mới nhất của FCode cho iPhone. Tải fcode.ipa rồi cài bằng Sideloadly."
          prerelease: true
          make_latest: false
          files: ios/fcode.ipa
          overwrite_files: true

      - name: Remove old fcoding.ipa asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest fcoding.ipa -y || true
