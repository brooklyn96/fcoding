name: iOS build (FCode)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (vX.Y.Z): build that tag and attach fcode.ipa to its release. Empty = normal build."
        required: false
        default: ""
  # A versioned release was published: build its tag and attach fcode.ipa to it.
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "test/origin-vectors.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "test/origin-vectors.json"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

concurrency:
  # Per branch (and per tag for a tag build): a feature-branch or tag build never cancels a main build.
  group: ios-build-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Release event or dispatch with a tag: only vX.Y.Z tags may get an IPA (never a tag such as `latest`); runs before the build to fail fast.
      - name: Check release tag
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag (vX.Y.Z): no IPA is attached to it."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Release / tag dispatch: build that tag (full ref, so a same-named branch cannot win). Empty = the event's default ref.
          ref: ${{ (github.event.release.tag_name || inputs.tag) && format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) || '' }}
          # Full history + tags: the version of a non-tag build is the newest version tag reachable from the checkout.
          fetch-depth: 0

      # The app has no test target: build Links.swift + PairLink.swift + HomeLogic.swift + ResponseCache.swift + LaunchFetch.swift + ScreenFeed.swift + MenuLogic.swift for macOS with a tiny main, run their selfTests and the shared origin vectors.
      # Older tags (v1.3.18-v1.3.20, tag backfill) have no MenuLogic.swift: that part is skipped, everything else is unchanged.
      - name: Links + PairLink + HomeLogic + ResponseCache + LaunchFetch + ScreenFeed + MenuLogic self-test
        run: |
          T=$(mktemp -d)
          SRC="Links.swift PairLink.swift HomeLogic.swift ResponseCache.swift LaunchFetch.swift ScreenFeed.swift"
          HAS_MENU=0
          if [ -f ios/fcoding/MenuLogic.swift ]; then
            HAS_MENU=1
            SRC="$SRC MenuLogic.swift"
          else
            echo "::notice::ios/fcoding/MenuLogic.swift is not in this tree: MenuLogic self-test skipped."
          fi
          for f in $SRC; do cp "ios/fcoding/$f" "$T/"; done
          cat > "$T/main.swift" <<'EOF'
          import Foundation
          var failures = Links.selfTest() + PairLink.selfTest().map { "PairLink " + $0 }
            + HomeLogic.selfTest().map { "HomeLogic " + $0 }
            + ResponseCache.selfTest().map { "ResponseCache " + $0 }
          failures += ScreenFeed.selfTest().map { "ScreenFeed " + $0 }
          failures += MenuLogic.selfTest().map { "MenuLogic " + $0 }
          failures += await LaunchFetch.selfTest().map { "LaunchFetch " + $0 }
          // The shared origin table (same file as the server tests), path as the first argument.
          if CommandLine.arguments.count > 1, let data = FileManager.default.contents(atPath: CommandLine.arguments[1]) {
              failures += PairLink.checkVectors(data).map { "vector " + $0 }
          } else {
              failures.append("origin vectors file missing")
          }
          for f in failures { print("FAIL \(f)") }
          print(failures.isEmpty ? "Self-test: all passed" : "Self-test: \(failures.count) failed")
          exit(failures.isEmpty ? 0 : 1)
          EOF
          if [ "$HAS_MENU" = 0 ]; then grep -v MenuLogic "$T/main.swift" > "$T/main.tmp" && mv "$T/main.tmp" "$T/main.swift"; fi
          cd "$T"
          xcrun -sdk macosx swiftc -o linktest $SRC main.swift
          ./linktest "$GITHUB_WORKSPACE/test/origin-vectors.json"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # App version, one rule for every event:
      #   MARKETING_VERSION = tag build (release event / dispatch with a tag): the tag without the leading v (v1.3.25 -> 1.3.25).
      #                       main (`latest`) and PR builds: the newest vX.Y.Z tag reachable from the checkout, without the v.
      #                       No such tag: ios/project.yml's value stays and a warning is printed.
      #   CURRENT_PROJECT_VERSION = run_number + 100: grows with every run of this workflow, always above the number in project.yml (29).
      - name: Resolve app version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            V="${TAG#v}"
          else
            T=$(git tag --merged HEAD --sort=-v:refname | grep -E -m1 '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            if [ -n "$T" ]; then
              V="${T#v}"
            else
              V=""
              echo "::warning::No vX.Y.Z tag is reachable from this checkout: the app keeps the version in ios/project.yml."
            fi
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "App version: ${V:-<project.yml>}"

      - name: Build (unsigned)
        working-directory: ios
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_ARGS=("CURRENT_PROJECT_VERSION=$((RUN_NUMBER + 100))")
          if [ -n "$APP_VERSION" ]; then
            VERSION_ARGS+=("MARKETING_VERSION=$APP_VERSION")
          fi
          xcodebuild -project fcoding.xcodeproj -scheme fcoding \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "${VERSION_ARGS[@]}" \
            build

      # The built app must show the resolved version (the tag's for a tag build): fail here so a wrong IPA is never zipped or attached.
      - name: Check app version
        if: env.APP_VERSION != ''
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/fcoding.app
          GOT=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          if [ "$GOT" != "$APP_VERSION" ]; then
            echo "::error::The built app says version '$GOT' but it must be '$APP_VERSION': no IPA is made."
            exit 1
          fi
          echo "App version $GOT as expected."

      - name: Package IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/fcoding.app
          test -d "$APP"
          rm -rf Payload fcode.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry fcode.ipa Payload
          ls -l fcode.ipa

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fcode-ipa
          path: ios/fcode.ipa
          if-no-files-found: error

      # Attach to the release's tag first (release event, or dispatch with a tag).
      - name: Attach fcode.ipa to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" ios/fcode.ipa --clobber

      # Does this run move the `latest` pre-release? One rule, one place:
      #   push to main / plain dispatch on main (no tag)  -> yes.
      #   release event                                   -> only when its tag is the newest strict vX.Y.Z tag at publish time (tags are re-fetched here, a release made during the build counts; a failed fetch = no update), so an older release never moves `latest` backwards.
      #   dispatch with a tag (backfill) / PR / other ref -> never.
      - name: Decide if "latest" is updated
        id: latest
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PUBLISH=false
          if [ "$EVENT" = release ]; then
            if git fetch --force --tags origin; then
              NEWEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
              echo "Release tag: $RELEASE_TAG; newest version tag: ${NEWEST:-<none>}"
              if [ "$RELEASE_TAG" = "$NEWEST" ]; then PUBLISH=true; fi
            else
              echo "::warning::Could not refresh tags: \`latest\` is not updated by this release run."
            fi
          elif [ "$EVENT" != pull_request ] && [ -z "$INPUT_TAG" ] && [ "$REF" = refs/heads/main ]; then
            PUBLISH=true
          fi
          echo "Update latest: $PUBLISH"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release "latest"
        if: steps.latest.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FCode (bản mới nhất)
          body: "Bản dựng mới nhất của FCode cho iPhone. Tải fcode.ipa rồi cài bằng Sideloadly."
          prerelease: true
          make_latest: false
          files: ios/fcode.ipa
          overwrite_files: true

      - name: Remove old fcoding.ipa asset
        if: steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest fcoding.ipa -y || true
