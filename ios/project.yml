name: fcoding
options:
  bundleIdPrefix: com.brooklyn96
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  fcoding:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: fcoding
        excludes:
          - Info.plist
          - Fonts/LICENSE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brooklyn96.fcoding
        PRODUCT_NAME: fcoding
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.3.15"
        CURRENT_PROJECT_VERSION: "21"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: fcoding/Info.plist
      properties:
        CFBundleDisplayName: FCode
        CFBundleName: FCode
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: vi
        CFBundleInfoDictionaryVersion: "6.0"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: FCode dùng camera để chụp ảnh gửi cho agent.
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.brooklyn96.fcoding.pair
            CFBundleURLSchemes:
              - fcode
        UIAppFonts:
          - SymbolsNerdFontMono-Regular.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme: {}
